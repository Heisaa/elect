<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riksdagsvalet 2026 – Gissa resultatet</title>
  <meta name="description" content="Gissa andelarna i riksdagsvalet 2026 och dela din gissning som bild eller text.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Riksdagsvalet 2026</h1>
      <p class="subtitle">Gissa varje partis andel av rösterna, med en decimal. Summan hamnar alltid på 100,0&nbsp;% – &ouml;vriga partier räknas ut automatiskt.</p>
    </header>

    <div class="controls">
      <button id="prefill-2022" class="btn secondary" type="button">Förifyll med 2022 års resultat</button>
      <button id="reset" class="btn ghost" type="button">Börja om</button>
    </div>

    <table id="party-table" aria-label="Din gissning">
      <thead>
        <tr>
          <th class="col-party">Parti</th>
          <th class="col-slider">Justera</th>
          <th class="col-input">Andel</th>
        </tr>
      </thead>
      <tbody>
        <!-- Party rows are generated by script.js -->
      </tbody>
      <tfoot>
        <tr class="total-row">
          <td>Totalt</td>
          <td></td>
          <td id="total-display">100,0&nbsp;%</td>
        </tr>
      </tfoot>
    </table>

    <p id="warning" class="warning hidden">Summan överstiger 100,0&nbsp;%. Minska något parti.</p>

    <div class="actions">
      <button id="download-btn" class="btn primary" type="button">Ladda ner bild</button>
      <button id="copy-btn" class="btn secondary" type="button">Kopiera som text</button>
    </div>
    <p id="copied-msg" class="copied-msg hidden">Kopierat till urklipp!</p>
  </main>

  <canvas id="result-canvas" width="1200" height="630" hidden></canvas>

  <script src="script.js"></script>
</body>
</html>
